<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BKG Bob</title><style>body{background:#05070a;color:#d9f7ff;font:14px system-ui;margin:0}main{max-width:1100px;margin:40px auto;padding:20px}.panel{background:#0e151c;border:1px solid #263743;border-radius:12px;padding:18px;margin:14px 0}h1{color:#00e5ff}button{background:#121b23;color:#00e5ff;border:1px solid #00e5ff;padding:9px 13px;border-radius:7px;cursor:pointer}input{background:#05070a;color:#fff;border:1px solid #38505e;padding:10px;width:70%;border-radius:7px}.key{border-top:1px solid #263743;padding:12px 0}.ok{color:#00ff9d}.bad{color:#ff3b6b}.warn{color:#ffd166}.mono{font-family:monospace}</style></head><body><main><h1>BKG BOB // LANES</h1><div class="panel"><div id="summary">Loading...</div><button id="recall">Create SSE recall link</button><pre id="link"></pre></div><div class="panel"><h2>Add Bob key / recall</h2><form id="f"><input id="key" placeholder="API key, auth code or callback URL" autocomplete="off"><input id="label" placeholder="Label (optional)" style="width:25%"><button>Add</button></form><p class="mono">Live SSE: <span id="sse">connecting...</span></p></div><div class="panel"><h2>Keys</h2><div id="keys"></div></div></main><script>const $=id=>document.getElementById(id);function render(s){$('summary').textContent=s.summary.withCoins+' keys with Bobcoins · '+s.summary.remainingBobcoins.toFixed(2)+' Bobcoins remaining · '+s.summary.enabled+' enabled / '+s.summary.total+' total';$('keys').innerHTML=s.keys.map(k=>'<div class="key"><b>'+k.label+'</b> <span class="mono">'+k.fingerprint+'</span> <span class="'+(k.status==='ready'?'ok':(k.status==='depleted'||k.status==='invalid'?'bad':'warn'))+'">'+k.status+'</span><br>Account: '+(k.account||'—')+' · Plan: '+(k.plan||'—')+' · Remaining: '+(k.remainingBobcoins===null?'unbounded':k.remainingBobcoins.toFixed(2))+' · Used: '+(k.usedBobcoins||0).toFixed(2)+' · Reset: '+(k.resetAt||'—')+'<br><button onclick="fetch(\'/api/keys/'+k.id+'\',{method:\'DELETE\'}).then(load)">Disable</button></div>').join('')}async function load(){const r=await fetch('/api/snapshot');if(r.ok)render(await r.json())}const es=new EventSource('/api/events');es.addEventListener('keys',e=>render(JSON.parse(e.data)));es.onopen=()=>$('sse').textContent='connected';$('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/keys',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:$('key').value,label:$('label').value})});const x=await r.json();if(!r.ok)alert(x.error);$('key').value='';load()};$('recall').onclick=async()=>{const x=await fetch('/api/recall',{method:'POST'}).then(r=>r.json());$('link').textContent=location.origin+x.url};load()</script></body></html>
